info:
  name: Create Mitglied
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/mitglieder"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "vorname": "Mia",
        "nachname": "Sommer",
        "email": "mia.sommer@example.com"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
