info:
  name: Get Mitglied
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/mitglieder/1"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
