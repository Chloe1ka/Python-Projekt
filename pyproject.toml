[project]
name = "python-projekt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chloe1ka", email = "hoch1028@h-ka.de" }
]
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2.1.1,<3.0.0", "psycopg[binary,pool]>=3.3.6,<4.0.0"]

[project.scripts]
python-projekt = "python_projekt:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

# https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-groups
[dependency-groups]
lint = [
    # http://pyrefly.org https://github.com/facebook/pyrefly
    "pyrefly>=1.4.0-dev.2,<2.0.0",
    # https://docs.astral.sh/ruff https://github.com/astral-sh/ruff
    "ruff>=0.16.9,<1.0.0",
    # https://github.com/astral-sh/ty
    "ty>=0.0.84,<1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
preview = true
